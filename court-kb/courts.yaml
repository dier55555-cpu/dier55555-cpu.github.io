# Список судов, чьи сайты нужно собирать в базу знаний ИИ-агента.
# slug — короткий идентификатор суда, используется для имён файлов и в ответах инструмента.
# name — человекочитаемое название (подставится в карточки знаний).
# base_url — стартовая страница сайта.
#
# case_search — настройки слоя 2 (поиск дела по номеру/ФИО, модуль sud_delo).
# production_types.delo_id — коды типов производства. Значения ниже (1540005 —
# гражданские первой инстанции, 1540006 — уголовные первой инстанции)
# подтверждены на других сайтах ГАС «Правосудие» (СПб, Башкортостан) и, судя
# по всему, одинаковы для всей платформы, но для ЭТИХ 6 судов Воронежа их
# case_search.enabled: true после проверки формы sud_delo на 6 судах Воронежа
# (вторая <form> на странице — поиск по номеру/фамилии, без капчи; первая — список
# заседаний на дату). Коды 1540005/1540006 подтверждены на этих сайтах.
# field_overrides — заполняется по итогам discover.py, если автоматическое
# сопоставление подписи->имя поля не сработало для конкретного суда.
courts:
  - slug: sovetsky-vrn
    name: Советский районный суд г. Воронежа
    base_url: https://sovetsky--vrn.sudrf.ru/
    case_search:
      enabled: true
      production_types:
        civil_first_instance: 1540005
        criminal_first_instance: 1540006
      field_overrides: {}

